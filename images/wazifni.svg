<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112f"/>
      <stop offset="1" stop-color="#0c1a2c"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".5" stop-color="#b06cff"/>
      <stop offset="1" stop-color="#ff6c9c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="140" fill="#7c5cff" opacity=".32" filter="url(#blur)"/>
  <circle cx="680" cy="420" r="140" fill="#ff5ca8" opacity=".25" filter="url(#blur)"/>

  <!-- CV document -->
  <g transform="translate(70 80)">
    <rect width="210" height="280" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".25"/>
    <circle cx="45" cy="50" r="22" fill="#9fb4ff"/>
    <rect x="80" y="36" width="105" height="11" rx="5" fill="#fff" opacity=".85"/>
    <rect x="80" y="56" width="70" height="9" rx="4" fill="#fff" opacity=".45"/>
    <g fill="#fff" opacity=".35">
      <rect x="24" y="100" width="162" height="8" rx="4"/>
      <rect x="24" y="118" width="140" height="8" rx="4"/>
      <rect x="24" y="136" width="155" height="8" rx="4"/>
      <rect x="24" y="170" width="162" height="8" rx="4"/>
      <rect x="24" y="188" width="120" height="8" rx="4"/>
      <rect x="24" y="206" width="150" height="8" rx="4"/>
    </g>
    <rect x="24" y="234" width="64" height="22" rx="11" fill="#7c5cff" opacity=".4"/>
    <rect x="96" y="234" width="54" height="22" rx="11" fill="#00d4ff" opacity=".35"/>
    <text x="105" y="-14" fill="#cfd3ff" font-size="15" text-anchor="middle" font-weight="600" letter-spacing="2">UPLOAD CV</text>
  </g>

  <!-- Arrow + AI spark -->
  <path d="M300 220 C 340 220, 340 220, 375 220" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g transform="translate(400 220)">
    <circle r="48" fill="#0b0b16" stroke="url(#ai)" stroke-width="4"/>
    <path d="M0 -30 C 4 -8, 8 -4, 30 0 C 8 4, 4 8, 0 30 C -4 8, -8 4, -30 0 C -8 -4, -4 -8, 0 -30 Z" fill="url(#ai)"/>
    <text y="80" fill="#e8e8f3" font-size="15" text-anchor="middle" font-weight="700" letter-spacing="2">GEMINI AI</text>
  </g>
  <path d="M455 220 C 480 220, 480 220, 500 220" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- Recommended jobs -->
  <g transform="translate(515 70)">
    <text x="0" y="0" fill="#cfd3ff" font-size="15" font-weight="600" letter-spacing="2">RECOMMENDED JOBS</text>
    <g transform="translate(0 20)">
      <rect width="225" height="78" rx="14" fill="#ffffff" fill-opacity=".08" stroke="url(#g)" stroke-width="2"/>
      <rect x="16" y="18" width="40" height="40" rx="10" fill="url(#g)"/>
      <text x="70" y="36" fill="#fff" font-size="15" font-weight="700">.NET Developer</text>
      <text x="70" y="56" fill="#9a9ab8" font-size="12">Full-time • Remote</text>
      <rect x="168" y="44" width="44" height="20" rx="10" fill="#28c840" opacity=".25"/>
      <text x="190" y="58" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="700">96%</text>
    </g>
    <g transform="translate(0 112)">
      <rect width="225" height="78" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
      <rect x="16" y="18" width="40" height="40" rx="10" fill="#ff5ca8" opacity=".8"/>
      <text x="70" y="36" fill="#fff" font-size="15" font-weight="700">Web Developer</text>
      <text x="70" y="56" fill="#9a9ab8" font-size="12">Full-time • On-site</text>
      <rect x="168" y="44" width="44" height="20" rx="10" fill="#28c840" opacity=".25"/>
      <text x="190" y="58" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="700">89%</text>
    </g>
    <g transform="translate(0 204)">
      <rect width="225" height="78" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
      <rect x="16" y="18" width="40" height="40" rx="10" fill="#ffd36b" opacity=".85"/>
      <text x="70" y="36" fill="#fff" font-size="15" font-weight="700">Front-End Dev</text>
      <text x="70" y="56" fill="#9a9ab8" font-size="12">Part-time • Hybrid</text>
      <rect x="168" y="44" width="44" height="20" rx="10" fill="#febc2e" opacity=".25"/>
      <text x="190" y="58" fill="#fcd34d" font-size="12" text-anchor="middle" font-weight="700">81%</text>
    </g>
  </g>

  <!-- Award ribbon -->
  <g transform="translate(110 420)">
    <circle r="26" fill="url(#g)"/>
    <text y="8" fill="#fff" font-size="24" text-anchor="middle">🏆</text>
    <text x="42" y="7" fill="#e8e8f3" font-size="16" font-weight="700">Certificate of Honor — Best Graduation Projects</text>
  </g>
</svg>
