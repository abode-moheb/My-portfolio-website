<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#151036"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="660" cy="100" r="140" fill="#00d4ff" opacity=".28" filter="url(#blur)"/>
  <circle cx="140" cy="420" r="140" fill="#7c5cff" opacity=".35" filter="url(#blur)"/>

  <!-- Endpoints panel -->
  <g transform="translate(60 60)">
    <rect width="420" height="380" rx="20" fill="#0b0b16" fill-opacity=".85" stroke="url(#g)" stroke-width="3"/>
    <circle cx="28" cy="28" r="7" fill="#ff5f57"/><circle cx="50" cy="28" r="7" fill="#febc2e"/><circle cx="72" cy="28" r="7" fill="#28c840"/>
    <text x="210" y="33" fill="#9a9ab8" font-size="14" text-anchor="middle">api/students</text>
    <rect x="0" y="52" width="420" height="1" fill="#ffffff" opacity=".1"/>

    <g font-size="16" font-weight="700">
      <rect x="24" y="74" width="76" height="30" rx="8" fill="#28c840" opacity=".2"/><text x="62" y="95" fill="#4ade80" text-anchor="middle">GET</text>
      <text x="116" y="95" fill="#e8e8f3" font-weight="400">/api/students</text>

      <rect x="24" y="118" width="76" height="30" rx="8" fill="#28c840" opacity=".2"/><text x="62" y="139" fill="#4ade80" text-anchor="middle">GET</text>
      <text x="116" y="139" fill="#e8e8f3" font-weight="400">/api/students/{id}</text>

      <rect x="24" y="162" width="76" height="30" rx="8" fill="#febc2e" opacity=".2"/><text x="62" y="183" fill="#fcd34d" text-anchor="middle">POST</text>
      <text x="116" y="183" fill="#e8e8f3" font-weight="400">/api/students</text>

      <rect x="24" y="206" width="76" height="30" rx="8" fill="#00d4ff" opacity=".2"/><text x="62" y="227" fill="#67e8f9" text-anchor="middle">PUT</text>
      <text x="116" y="227" fill="#e8e8f3" font-weight="400">/api/students/{id}</text>

      <rect x="24" y="250" width="76" height="30" rx="8" fill="#ff5f57" opacity=".2"/><text x="62" y="271" fill="#fca5a5" text-anchor="middle">DELETE</text>
      <text x="116" y="271" fill="#e8e8f3" font-weight="400">/api/students/{id}</text>
    </g>

    <rect x="24" y="306" width="372" height="50" rx="12" fill="#7c5cff" opacity=".15" stroke="#7c5cff" stroke-opacity=".5"/>
    <text x="44" y="337" fill="#c4b5fd" font-size="14">Authorization: Bearer eyJhbGci…</text>
  </g>

  <!-- JSON response -->
  <g transform="translate(510 170)">
    <rect width="240" height="200" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="20" y="34" fill="#4ade80" font-size="14" font-weight="700">200 OK</text>
    <g font-size="14">
      <text x="20" y="64" fill="#e8e8f3">{</text>
      <text x="36" y="88"><tspan fill="#67e8f9">"id"</tspan><tspan fill="#e8e8f3">: </tspan><tspan fill="#fcd34d">7</tspan><tspan fill="#e8e8f3">,</tspan></text>
      <text x="36" y="112"><tspan fill="#67e8f9">"name"</tspan><tspan fill="#e8e8f3">: </tspan><tspan fill="#f9a8d4">"Sara"</tspan><tspan fill="#e8e8f3">,</tspan></text>
      <text x="36" y="136"><tspan fill="#67e8f9">"age"</tspan><tspan fill="#e8e8f3">: </tspan><tspan fill="#fcd34d">21</tspan><tspan fill="#e8e8f3">,</tspan></text>
      <text x="36" y="160"><tspan fill="#67e8f9">"grade"</tspan><tspan fill="#e8e8f3">: </tspan><tspan fill="#fcd34d">92</tspan></text>
      <text x="20" y="184" fill="#e8e8f3">}</text>
    </g>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(630 95)">
    <path d="M-70 0 L0 -32 L70 0 L0 32 Z" fill="url(#g)"/>
    <path d="M-40 14 V42 Q0 62 40 42 V14 L0 32 Z" fill="#7c5cff"/>
    <path d="M58 6 V44" stroke="#ffd36b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="58" cy="48" r="7" fill="#ffd36b"/>
  </g>

  <!-- Lock (JWT) -->
  <g transform="translate(500 400)">
    <rect x="0" y="18" width="46" height="38" rx="9" fill="url(#g)"/>
    <path d="M10 18 V8 a13 13 0 0 1 26 0 V18" fill="none" stroke="#00d4ff" stroke-width="5"/>
    <circle cx="23" cy="36" r="5" fill="#0b0b16"/>
    <text x="60" y="44" fill="#cfd3ff" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600">JWT Secured</text>
  </g>
</svg>
