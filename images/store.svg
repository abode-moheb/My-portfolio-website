<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ca8"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="680" cy="80" r="130" fill="#ff5ca8" opacity=".3" filter="url(#blur)"/>
  <circle cx="120" cy="440" r="140" fill="#7c5cff" opacity=".35" filter="url(#blur)"/>

  <!-- POS monitor -->
  <g transform="translate(70 70)">
    <rect width="390" height="260" rx="20" fill="#0b0b16" stroke="url(#g2)" stroke-width="3"/>
    <rect x="16" y="16" width="358" height="228" rx="12" fill="#ffffff" fill-opacity=".05"/>
    <text x="34" y="50" fill="#fff" font-size="18" font-weight="700">Sales • Invoice #1024</text>
    <g font-size="14" fill="#cfd3ff">
      <rect x="34" y="66" width="322" height="1" fill="#ffffff" opacity=".15"/>
      <text x="34" y="92">Milk 1L</text><text x="250" y="92">x2</text><text x="356" y="92" text-anchor="end">$3.40</text>
      <text x="34" y="120">Bread</text><text x="250" y="120">x1</text><text x="356" y="120" text-anchor="end">$1.20</text>
      <text x="34" y="148">Coffee 250g</text><text x="250" y="148">x1</text><text x="356" y="148" text-anchor="end">$6.90</text>
      <text x="34" y="176">Rice 5kg</text><text x="250" y="176">x1</text><text x="356" y="176" text-anchor="end">$8.50</text>
      <rect x="34" y="190" width="322" height="1" fill="#ffffff" opacity=".15"/>
    </g>
    <text x="34" y="224" fill="#fff" font-size="18" font-weight="700">TOTAL</text>
    <text x="356" y="224" fill="#00d4ff" font-size="22" font-weight="800" text-anchor="end">$20.00</text>
    <rect x="165" y="260" width="60" height="40" fill="#22223f"/>
    <rect x="115" y="300" width="160" height="14" rx="7" fill="#22223f"/>
  </g>

  <!-- Barcode scanner beam -->
  <g transform="translate(500 70)">
    <rect width="230" height="140" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <g fill="#e8e8f3">
      <rect x="25" y="25" width="6" height="80"/><rect x="36" y="25" width="3" height="80"/>
      <rect x="44" y="25" width="9" height="80"/><rect x="58" y="25" width="3" height="80"/>
      <rect x="66" y="25" width="6" height="80"/><rect x="78" y="25" width="3" height="80"/>
      <rect x="86" y="25" width="10" height="80"/><rect x="101" y="25" width="4" height="80"/>
      <rect x="110" y="25" width="6" height="80"/><rect x="121" y="25" width="3" height="80"/>
      <rect x="129" y="25" width="9" height="80"/><rect x="143" y="25" width="3" height="80"/>
      <rect x="151" y="25" width="6" height="80"/><rect x="162" y="25" width="4" height="80"/>
      <rect x="171" y="25" width="10" height="80"/><rect x="186" y="25" width="3" height="80"/>
      <rect x="194" y="25" width="8" height="80"/>
    </g>
    <text x="115" y="126" fill="#9a9ab8" font-size="13" text-anchor="middle" letter-spacing="3">6 291041 500213</text>
    <rect x="10" y="62" width="210" height="4" rx="2" fill="#ff3b6b"/>
    <rect x="10" y="56" width="210" height="16" rx="8" fill="#ff3b6b" opacity=".25"/>
  </g>

  <!-- Cart -->
  <g transform="translate(520 260)" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H40 L70 130 H190 L215 40 H55"/>
    <circle cx="85" cy="165" r="14" fill="#ff5ca8" stroke="none"/>
    <circle cx="175" cy="165" r="14" fill="#7c5cff" stroke="none"/>
  </g>
  <g transform="translate(585 270)">
    <rect width="40" height="40" rx="8" fill="#00d4ff" opacity=".85"/>
    <rect x="50" y="-15" width="45" height="55" rx="8" fill="#ffd36b" opacity=".9"/>
    <rect x="105" y="5" width="35" height="35" rx="8" fill="#ff5ca8" opacity=".85"/>
  </g>

  <!-- Mini chart -->
  <g transform="translate(70 410)">
    <rect width="390" height="60" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <polyline points="20,45 70,35 120,40 170,22 220,28 270,14 320,20 370,8" fill="none" stroke="url(#g2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
