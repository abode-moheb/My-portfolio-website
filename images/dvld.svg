<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="130" fill="#7c5cff" opacity=".35" filter="url(#blur)"/>
  <circle cx="690" cy="430" r="140" fill="#00d4ff" opacity=".3" filter="url(#blur)"/>

  <!-- Road -->
  <path d="M0 430 Q400 360 800 430 L800 500 L0 500 Z" fill="#0a0a18" opacity=".8"/>
  <path d="M40 455 h60 M160 445 h60 M280 438 h60 M400 436 h60 M520 438 h60 M640 445 h60" stroke="#ffd36b" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- License card -->
  <g transform="translate(110 95) rotate(-6)">
    <rect width="360" height="225" rx="22" fill="url(#card)" stroke="url(#g)" stroke-width="3"/>
    <rect width="360" height="52" rx="22" fill="url(#g)"/>
    <rect y="30" width="360" height="22" fill="url(#g)"/>
    <text x="22" y="35" fill="#fff" font-size="20" font-weight="700" letter-spacing="2">DRIVING LICENSE</text>
    <rect x="22" y="72" width="95" height="120" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".3"/>
    <circle cx="69.5" cy="115" r="22" fill="#9fb4ff"/>
    <path d="M35 185 q34.5 -45 69 0" fill="#9fb4ff"/>
    <rect x="135" y="80" width="190" height="12" rx="6" fill="#fff" opacity=".8"/>
    <rect x="135" y="104" width="140" height="10" rx="5" fill="#fff" opacity=".45"/>
    <rect x="135" y="126" width="165" height="10" rx="5" fill="#fff" opacity=".45"/>
    <rect x="135" y="148" width="110" height="10" rx="5" fill="#fff" opacity=".45"/>
    <rect x="135" y="170" width="70" height="24" rx="12" fill="#00d4ff" opacity=".25"/>
    <text x="146" y="187" fill="#00d4ff" font-size="13" font-weight="700">CLASS B</text>
  </g>

  <!-- Car -->
  <g transform="translate(470 250)">
    <path d="M20 110 L40 60 Q52 32 85 30 L185 30 Q215 32 232 60 L262 110 Z" fill="url(#g)"/>
    <rect x="0" y="100" width="285" height="60" rx="22" fill="url(#g)"/>
    <path d="M62 95 L78 55 Q84 44 98 44 L135 44 L135 95 Z" fill="#0b1a2e" opacity=".55"/>
    <path d="M150 95 L150 44 L180 44 Q196 44 204 56 L226 95 Z" fill="#0b1a2e" opacity=".55"/>
    <rect x="248" y="115" width="26" height="14" rx="6" fill="#fff6c2"/>
    <rect x="10" y="115" width="20" height="14" rx="6" fill="#ff5ca8"/>
    <circle cx="68" cy="160" r="30" fill="#0a0a18"/><circle cx="68" cy="160" r="13" fill="#9a9ab8"/>
    <circle cx="218" cy="160" r="30" fill="#0a0a18"/><circle cx="218" cy="160" r="13" fill="#9a9ab8"/>
  </g>

  <!-- Badge / check -->
  <g transform="translate(590 70)">
    <circle r="52" fill="#0b0b16" stroke="url(#g)" stroke-width="4"/>
    <path d="M-22 2 L-6 18 L24 -14" fill="none" stroke="#00d4ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="590" y="150" fill="#cfd3ff" font-size="15" text-anchor="middle" letter-spacing="3" font-weight="600">VERIFIED</text>
</svg>
